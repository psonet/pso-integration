name: Rust unit & integration tests
description: >-
  cargo nextest across the workspace, network-free targets only.
  Same shape as rust-check but the cache scope and the actual cargo
  invocation differ. Mirrors psonet/bank-data-provider.

inputs:
  token:
    description: PAT for private psonet/* repo access.
    required: true
  cache-key:
    description: Shared cache key for Swatinem/rust-cache.
    required: false
    default: "host-test"
  save-cache:
    description: >-
      Whether to save the rust-cache entry after the run. "false"
      for tag/release builds.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: Install C++ toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake clang \
          libstdc++-12-dev \
          libc++-dev libc++abi-dev \
          pkg-config libssl-dev

    - uses: ./.github/actions/configure-private-git
      with:
        token: ${{ inputs.token }}

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    # `--lib --tests` excludes integration tests that need a live
    # PSO L2 node. The testsuite's own integration tests under
    # `testsuite/tests/framework.rs` are network-free by
    # construction (envelope encoding, errors decoder, data shape)
    # so they participate here.
    #
    # --profile ci: retries, fail-fast off and the JUnit report the
    # flaky reporter below reads. Same runner, same profile name,
    # in every psonet repo.
    - name: Test (nextest, workspace --lib + tests/)
      shell: bash
      run: cargo nextest run --workspace --lib --tests --profile ci

    # Retries turn a slow runner into a pass and hide that the test is
    # unstable. This reads the JUnit report back and warns per test that only
    # survived on a retry. Never fails the job.
    - name: Report flaky tests
      if: always()
      shell: bash
      run: |
        command -v python3 >/dev/null 2>&1 || {
          echo "::notice::python3 unavailable; skipping the flaky-test report"
          exit 0
        }
        python3 .github/scripts/warn_flaky.py target/nextest/ci/junit.xml

    # nextest builds and runs each test in its own process, which is
    # what makes retries and partitioning possible — but it cannot run
    # doctests. Without this they would silently stop being tested.
    - name: cargo test --doc
      shell: bash
      run: cargo test --doc --workspace
